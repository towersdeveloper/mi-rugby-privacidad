:root{--bg:#e8f3fb;--card:#fff;--tx:#172233;--mut:#5b6b7d;--bd:#d3e0ec;--ac:#1f8a4c;--ac2:#f2c230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#182636;--tx:#e9f0f7;--mut:#9fb0c1;--bd:#2a3c4f}}
:root[data-theme="dark"]{--bg:#0e1a26;--card:#182636;--tx:#e9f0f7;--mut:#9fb0c1;--bd:#2a3c4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hd{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700}
nav{overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding:8px;background:var(--bg)}
nav button{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border:2px solid transparent;border-radius:14px;background:var(--card);color:var(--mut);font:600 12px system-ui,sans-serif}
nav button svg{display:block;margin:2px 0 3px;image-rendering:pixelated;transition:transform .15s}
nav button:not(.on) svg{filter:saturate(.45);opacity:.8}
nav button.on svg{transform:scale(1.12)}
nav button.on{color:var(--tx);border-color:var(--ac);background:linear-gradient(var(--card),var(--card)) padding-box}
main{max-width:560px;margin:0 auto;padding:8px 14px 40px}
.scene{position:relative;height:300px;border-radius:22px;overflow:hidden;background:linear-gradient(#7fcdf5,#cdeeff 60%);box-shadow:0 6px 0 var(--ac);margin-bottom:22px}
.grass{position:absolute;left:0;right:0;bottom:0;height:40%;background:repeating-linear-gradient(90deg,#3f9d4f 0 36px,#4db35e 36px 72px)}
.sun{position:absolute;top:16px;right:18px;width:30px;height:30px;background:#ffd84a;box-shadow:0 0 0 6px #ffe98a}
.post{position:absolute;bottom:40%;width:6px;height:96px;background:#fff;border-radius:3px}
.cb{position:absolute;bottom:calc(40% + 38px);height:6px;background:#fff}
.sh{position:absolute;bottom:11%;left:50%;width:110px;height:14px;margin-left:-55px;background:rgba(0,0,0,.2);border-radius:50%}
.pl{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);line-height:0}
.pl svg{image-rendering:pixelated;display:block}
.idle{animation:bob 1s steps(2) infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.idle{animation:none}}
.bub{position:absolute;top:12px;left:12px;max-width:50%;background:#fff;color:#172233;border-radius:14px;padding:7px 12px;font-weight:600;font-size:14px;line-height:1.3}
.plate{display:flex;align-items:center;gap:12px;margin:-4px 0 14px}
.plate .n{min-width:58px;text-align:center;font-size:40px;line-height:1;padding:6px 8px;border-radius:12px;background:var(--ac);color:#fff;border-bottom:5px solid var(--ac2)}
.plate h1{margin:0;font-size:32px;line-height:1;overflow-wrap:anywhere}
.plate p{margin:2px 0 0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;border-bottom:4px solid var(--ac2)}
.stat b{display:block;font-size:30px;line-height:1.1;color:var(--ac)}
.stat span{font-size:13px;color:var(--mut)}
section{background:var(--card);border-radius:18px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:25px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;font:16px system-ui,sans-serif;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px}
input[type=color]{height:44px;padding:2px}
input[type=range]{padding:0;accent-color:var(--ac)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 16px system-ui,sans-serif;border-bottom:4px solid rgba(0,0,0,.25)}
.btn.sm{width:auto;padding:6px 10px;font-size:13px;border-bottom-width:2px}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip,.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd);padding:0}
.on.chip,.on.sw{box-shadow:0 0 0 3px var(--tx)}
.sub{font-size:14px;color:var(--mut);margin:0}
.sk{margin-bottom:12px}
.sk .t{display:flex;justify-content:space-between;font-weight:600}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px}
.sk small,.mut{color:var(--mut);font-size:13px}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.li:first-of-type{border-top:0}
.li div{min-width:0}.li p{margin:0;overflow-wrap:anywhere}
.big{font-size:28px;color:var(--ac)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--bd);color:var(--tx)}
.g-Leve{background:#cfe9d6;color:#14532d}.g-Moderada{background:#fde7b0;color:#6b4500}.g-Grave{background:#f7c4c4;color:#7a1414}
.ok{opacity:.55}
.warn{border-left:5px solid #d64545;background:var(--card);padding:10px 12px;border-radius:10px;margin:0 0 16px;font-size:14px}
.ch{width:100%;height:auto;margin-bottom:4px}
.nudge{border-left-color:var(--ac2)}.nudge .btn{margin-top:8px}.mini{width:84px;margin:0}
.hosp{background:#8fb8c4;box-shadow:0 6px 0 #5c7289}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,transparent 0 47px,#6c8091 47px 48px),#7f93a3;border-top:4px solid #5f7482}
.win{position:absolute;left:8%;top:70px;width:66px;height:72px;background:linear-gradient(#8fd3f7,#d6f0ff);border:5px solid #fff;box-shadow:0 0 0 2px #b9c6d1}
.cross{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:6px;background:linear-gradient(#d64545,#d64545) center/62% 24% no-repeat,linear-gradient(#d64545,#d64545) center/24% 62% no-repeat,#fff}
.mon{position:absolute;right:8%;top:62px;width:64px;height:42px;background:#10202b;border:3px solid #5c7289;border-radius:6px;padding:4px}
.mon svg{width:100%;height:100%;display:block}
.bub{box-shadow:0 2px 0 rgba(0,0,0,.18)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600}
#toast[hidden]{display:none}
.stats.s4{grid-template-columns:repeat(4,1fr)}.stats.s4 b{font-size:26px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.bd{background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bd svg{display:block;image-rendering:pixelated}.bd.off svg{opacity:.6}
.bd b{font-size:15px;line-height:1.15}.bd small{font-size:12px;color:var(--mut);line-height:1.3}
.bd .bar{width:100%;height:8px;margin-top:2px}
.bd .got{font-size:12px;font-weight:600;color:var(--ac)}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}.prog .bar{flex:1;margin:0}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,18,28,.6)}
.mcard{width:100%;max-width:320px;background:var(--card);border-radius:22px;padding:22px 20px;text-align:center;border-bottom:6px solid var(--ac2);animation:pop .35s steps(4)}
.mcard svg{display:block;margin:6px auto 10px;image-rendering:pixelated}
.mcard h2{margin:0 0 4px;font-size:30px}.mcard p{margin:0 0 16px;color:var(--mut)}
.mcard .k{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
section .stat{background:var(--bg)}
.s-noche{background:linear-gradient(#0b1530,#22346a 75%)}
.post.wood,.cb.wood{background:#9a6a3a}
.grass.worn{background:radial-gradient(ellipse 60px 14px at 30% 40%,#a08a5a 60%,transparent 62%),radial-gradient(ellipse 40px 10px at 75% 70%,#a08a5a 60%,transparent 62%),repeating-linear-gradient(90deg,#5ba85c 0 36px,#66b366 36px 72px)}
.fence{position:absolute;left:0;right:0;bottom:40%;height:36px;background:linear-gradient(#8a6a45,#8a6a45) 0 6px/100% 3px no-repeat,linear-gradient(#8a6a45,#8a6a45) 0 24px/100% 3px no-repeat,repeating-linear-gradient(90deg,#7a5a35 0 5px,transparent 5px 44px)}
.ads{position:absolute;left:0;right:0;bottom:40%;height:14px;background:repeating-linear-gradient(90deg,var(--ac) 0 60px,var(--ac2) 60px 120px);border-top:2px solid rgba(0,0,0,.25)}

function chart(){
 const a=[...S.bronco].sort((x,y)=>x.d<y.d?-1:1);
 if(a.length<2)return '<p class="mut">Cargá al menos 2 tests para ver tu gráfico.</p>';
 const W=300,H=130,L=40,R=12,T=14,B=26,mn=Math.min(...a.map(x=>x.t)),mx=Math.max(...a.map(x=>x.t)),r=(mx-mn)||1;
 const X=i=>L+i*(W-L-R)/(a.length-1),Y=t=>T+(t-mn)/r*(H-T-B);
 const pts=a.map((x,i)=>[X(i),Y(x.t)]);
 const lab=(x,y,t,an)=>`<text x="${x}" y="${y}" font-size="10" fill="var(--mut)" text-anchor="${an}">${t}</text>`;
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tus tiempos de bronco"><line x1="${L}" y1="${T}" x2="${W-R}" y2="${T}" stroke="var(--bd)"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--bd)"/>${lab(L-4,T+4,fmt(mn),'end')}${lab(L-4,H-B+4,fmt(mx),'end')}${lab(L,H-8,fd(a[0].d).slice(0,5),'start')}${lab(W-R,H-8,fd(a[a.length-1].d).slice(0,5),'end')}<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${a[i].t===mn?6:4}" fill="${a[i].t===mn?'var(--ac2)':'var(--ac)'}" stroke="var(--ac)" stroke-width="2"/>`).join('')}</svg><p class="mut" style="margin:0 0 8px">Cada punto es un test. Mientras más arriba, más rápido tu tiempo. El punto grande es tu mejor tiempo.</p>`;
}

 const r0=recs();
 if(a==='rpre'){$('#rt').value=b.dataset.v;$('#rh').value=b.dataset.h;return}
 if(a==='notif'){try{Notification.requestPermission().then(render)}catch(e){toast('Tu navegador no permite avisos del celular')}return}
 if(a==='tab'){tab=b.dataset.t;view='main';if(b.dataset.sub)lsub=b.dataset.sub;window.scrollTo(0,0)}
 else if(a==='locker')view='locker';
 else if(a==='back')view='main';
 else if(a==='cyc'){const k=b.dataset.k,d=+b.dataset.d,wr=(arr,c)=>arr[(arr.indexOf(c)+d+arr.length)%arr.length];
  if(k==='style')S.p.style=wr(STY,S.p.style);
  else if(k==='outfit')S.p.outfit=wr(OUT,S.p.outfit);
  else if(k==='hair')S.p.hair=wr(HAIR,S.p.hair);
  else if(k==='skin')S.p.skin=wr(SKIN,S.p.skin);
  else if(k==='head')S.p.head=wr(['Nada','Vincha','Casco'],S.p.head);
  else if(k==='boots')S.p.boots=wr(['Negros','Dorados'],S.p.boots);
  else if(k==='shirt')S.p.shirt=wr(['Del equipo','Leyenda'],S.p.shirt);
  else if(k==='team'){const i=PRE.findIndex(x=>x[1]===S.p.c1&&x[2]===S.p.c2),n=PRE[(i+d+PRE.length)%PRE.length];S.p.c1=n[1];S.p.c2=n[2];applyColor()}}
 else if(a==='set'){S.p[b.dataset.k]=b.dataset.v;applyColor()}
 else if(a==='preset'){const p=PRE[+b.dataset.i];S.p.c1=p[1];S.p.c2=p[2];applyColor()}
 else if(a==='addsession'){const d=$('#sd').value||today(),n=$('#sn').value.trim();let c=0;document.querySelectorAll('[data-sk]').forEach(el=>{if(el.value){S.logs.push({id:uid(),d,s:S.skills[+el.dataset.sk],v:+el.value,n});c++}});if(!c)return}
 else if(a==='addskill'){const n=$('#ns').value.trim().slice(0,24);if(!n||S.skills.includes(n))return;S.skills.push(n);lastSkill=n}
 else if(a==='addbronco'){const t=(+$('#bm').value||0)*60+(+$('#bs').value||0);if(t<=0)return;S.bronco.push({id:uid(),d:$('#bd').value||today(),t:Math.round(t)})}
 else if(a==='addinj'){const d=$('#jd').value||today(),n=+$('#jt').value||0,k=$('#ju').value==='semanas'?7:1;
  S.inj.push({id:uid(),d,z:$('#jz').value,g:$('#jg').value,n:$('#jn').value.trim(),ok:false,until:n>0?new Date(d+'T00:00:00').getTime()+n*k*864e5:null})}
 else if(a==='addrem'){const t=$('#rt').value.trim().slice(0,40),h=$('#rh').value,k=$('#rd').value;if(!t||!h)return;S.rem.push({id:uid(),t,h,d:k==='Lunes a viernes'?[1,2,3,4,5]:k==='Fines de semana'?[0,6]:[0,1,2,3,4,5,6],last:'',done:''})}
 else if(a==='rdone'){const r=S.rem.find(x=>x.id===b.dataset.id);if(r)r.done=r.done===ld()?'':ld()}
 else if(a==='addm'){const rv=$('#mr').value.trim();if(!rv){toast('Escribí el nombre del rival');return}
  const sels=[...document.querySelectorAll('[data-ms]')];sels.forEach(el=>{el.style.borderColor=el.value?'':'#d64545'});
  if(sels.some(el=>!el.value && !el.closest('.optional-skill'))){toast('Calificá todas las habilidades obligatorias para guardar el partido');return}
  const club=($('#mc')?$('#mc').value.trim():'')||S.p.club||'Mi club',d=$('#md').value||today(),st={},sk={};
  ST.forEach(([k])=>{st[k]=+$('#m_'+k).value||0});
  document.querySelectorAll('[data-ms]').forEach(el=>{if(el.value){const n=S.skills[+el.dataset.ms];sk[n]=+el.value;S.logs.push({id:uid(),d,s:n,v:+el.value,n:'Partido vs '+rv})}});
  S.p.club=club;
  S.m.push({id:uid(),d,club,rival:rv,gf:+$('#mg').value||0,ga:+$('#ma').value||0,ov:+$('#mo').value||0,min:Math.max(0,Math.min(240,Math.round(+$('#mmin').value||0))),tit:$('#mtit').value,st,sk,n:$('#mn').value.trim()})}
 else if(a==='toggle'){const i=S.inj.find(x=>x.id===b.dataset.id);if(i)i.ok=!i.ok}
 else if(a==='del'){const k=b.dataset.k;S[k]=S[k].filter(x=>x.id!==b.dataset.id)}
 syncAll();newRecs(r0,recs());save();render();showPop();
 if(a==='addrem'||(a==='del'&&b.dataset.k==='rem'))syncNotifs(a==='addrem');
});
document.addEventListener('change',e=>{
 if(e.target.id==='monsel'){mon=e.target.value;render();return}
 if(e.target.id==='seasel'){sea=e.target.value;render();return}
 const k=e.target.dataset.p;if(!k)return;
 S.p[k]=k==='cap'?e.target.value==='Sí':e.target.value;applyColor();save();
 if(k==='name'||k==='club'||k==='num'){const h=$('.plate h1'),n=$('.plate .n');if(h)h.textContent=S.p.name||'Tu jugador';if(n)n.textContent=S.p.num||'0';if(S.p.name&&S.p.club){const x=$('#setup');if(x)x.remove()}return}
 render();
});
document.addEventListener('input',e=>{if(e.target.id==='sv')$('#svv').textContent=e.target.value});
setInterval(()=>document.querySelectorAll('[data-until]').forEach(el=>{const t=remain(+el.dataset.until);el.innerHTML=el.tagName==='SPAN'?t:'<b>'+t+'</b>'}),30000);
$('#toast').addEventListener('click',e=>{e.currentTarget.hidden=true});setInterval(check,20000);check();applyColor();render();
if(NAT){syncNotifs(false);const ap=PL('App');if(ap)ap.addListener('backButton',()=>{const m=document.querySelector('.modal');if(m){m.remove();if(m.id==='popm')pop.shift();showPop();return}if(view==='locker'){view='main';render();return}if(tab!=='perfil'){tab='perfil';view='main';render();window.scrollTo(0,0);return}ap.exitApp()})}
if(!NAT&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
